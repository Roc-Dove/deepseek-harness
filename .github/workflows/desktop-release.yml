# Build desktop installers on their native operating systems. Pull requests and
# non-publishing manual runs are deliberately credential-free rehearsals. Public
# desktop-v* releases are rebuilt in jobs protected by the desktop-release
# environment, signed on each platform, verified, and uploaded as one release.
# Third-party Actions are pinned to official major-tag commits resolved on
# 2026-08-17; each inline comment records the concrete release at that commit.
name: Desktop distribution

on:
  pull_request:
  push:
    tags: [desktop-v*]
  workflow_dispatch:
    inputs:
      publish:
        description: Build signed installers and publish the desktop-v* tag as a GitHub release.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  authorize-release:
    name: Authorize desktop release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Match tag to desktop package version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "desktop-v$version" ] || {
            echo "::error::A signed release must run from tag desktop-v$version."
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  unsigned:
    name: Unsigned rehearsal (${{ matrix.target }})
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
            command: desktop:dist:mac
            output: mac-arm64
          - target: macos-x64
            runner: macos-15-intel
            command: desktop:dist:mac
            output: mac-x64
          - target: windows-x64
            runner: windows-2025
            command: desktop:dist:win
            output: win-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build unsigned installer
        run: pnpm run ${{ matrix.command }}

      - name: Verify installed runtime
        run: pnpm run desktop:verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: |
            .artifacts/desktop/${{ matrix.output }}/*.dmg
            .artifacts/desktop/${{ matrix.output }}/*.zip
            .artifacts/desktop/${{ matrix.output }}/*.exe
            .artifacts/desktop/${{ matrix.output }}/build-manifest.json
            .artifacts/desktop/${{ matrix.output }}/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  signed-mac:
    name: Signed release (${{ matrix.target }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: authorize-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
            output: mac-arm64
          - target: macos-x64
            runner: macos-15-intel
            output: mac-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare temporary macOS notarization key
        id: notarization-key
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_API_KEY_P8_BASE64" ] || { echo "::error::DESKTOP_APPLE_API_KEY_P8_BASE64 is required."; exit 1; }
          umask 077
          key="$RUNNER_TEMP/desktop-notarization-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          [ -s "$key" ] || { echo "::error::Decoded notarization key is empty."; exit 1; }
          echo "path=$key" >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Build signed installer
        env:
          DSH_DESKTOP_REQUIRE_SIGNING: '1'
          DSH_DESKTOP_NOTARIZE: '1'
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.notarization-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          [ -n "$CSC_LINK" ] || { echo "::error::DESKTOP_MAC_CSC_LINK is required."; exit 1; }
          [ -n "$CSC_KEY_PASSWORD" ] || { echo "::error::DESKTOP_MAC_CSC_KEY_PASSWORD is required."; exit 1; }
          [ -f "$APPLE_API_KEY" ] || { echo "::error::Temporary notarization key is missing."; exit 1; }
          [ -n "$APPLE_API_KEY_ID" ] || { echo "::error::DESKTOP_APPLE_API_KEY_ID is required."; exit 1; }
          [ -n "$APPLE_API_ISSUER" ] || { echo "::error::DESKTOP_APPLE_API_ISSUER is required."; exit 1; }
          pnpm run desktop:dist:mac

      - name: Verify installed runtime
        run: pnpm run desktop:verify

      - name: Verify macOS signature, Gatekeeper assessment, and notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          app=''
          count=0
          while IFS= read -r candidate; do
            app="$candidate"
            count=$((count + 1))
          done < <(
            find ".artifacts/desktop/${{ matrix.output }}" -maxdepth 2 -type d -name '*.app' -prune -print
          )
          [ "$count" -eq 1 ] || {
            echo "::error::Expected one packaged .app, found $count."
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}-${{ needs.authorize-release.outputs.version }}
          path: |
            .artifacts/desktop/${{ matrix.output }}/*.dmg
            .artifacts/desktop/${{ matrix.output }}/*.zip
            .artifacts/desktop/${{ matrix.output }}/build-manifest.json
            .artifacts/desktop/${{ matrix.output }}/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  signed-windows:
    name: Signed release (windows-x64)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: authorize-release
    runs-on: windows-2025
    timeout-minutes: 60
    environment: desktop-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build signed installer
        shell: pwsh
        env:
          DSH_DESKTOP_REQUIRE_SIGNING: '1'
          DSH_DESKTOP_NOTARIZE: '0'
          WIN_CSC_LINK: ${{ secrets.DESKTOP_WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'DESKTOP_WIN_CSC_LINK is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'DESKTOP_WIN_CSC_KEY_PASSWORD is required.'
          }
          pnpm run desktop:dist:win

      - name: Verify installed runtime
        run: pnpm run desktop:verify

      - name: Verify Windows application and installer signatures
        shell: pwsh
        run: |
          $output = Resolve-Path '.artifacts/desktop/win-x64'
          $main = @(
            Get-ChildItem -LiteralPath $output -Recurse -File |
              Where-Object { $_.Name -eq 'DeepSeek Harness.exe' }
          )
          if ($main.Count -ne 1) {
            throw "Expected one unpacked DeepSeek Harness.exe, found $($main.Count)."
          }
          $installer = @(
            Get-ChildItem -LiteralPath $output -File -Filter '*.exe' |
              Where-Object { $_.Name -like 'DeepSeek-Harness-*-win-x64.exe' }
          )
          if ($installer.Count -ne 1) {
            throw "Expected one signed NSIS installer, found $($installer.Count)."
          }
          $uninstallers = @(
            Get-ChildItem -LiteralPath $output -Recurse -File -Filter '*.exe' |
              Where-Object { $_.Name -match '^(uninstall|unins).*\.exe$' }
          )
          $signedFiles = @($main + $installer + $uninstallers)
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Valid Authenticode signature: $($file.FullName)"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-x64-${{ needs.authorize-release.outputs.version }}
          path: |
            .artifacts/desktop/win-x64/*.exe
            .artifacts/desktop/win-x64/*.zip
            .artifacts/desktop/win-x64/build-manifest.json
            .artifacts/desktop/win-x64/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub desktop release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [authorize-release, signed-mac, signed-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*-${{ needs.authorize-release.outputs.version }}
          path: dist

      - name: Prepare release metadata and record artifact hashes
        env:
          VERSION: ${{ needs.authorize-release.outputs.version }}
        run: |
          set -euo pipefail
          for target in macos-arm64 macos-x64 windows-x64; do
            source="dist/desktop-$target-$VERSION"
            [ -f "$source/build-manifest.json" ] || { echo "::error::$source/build-manifest.json is missing."; exit 1; }
            [ -f "$source/SHA256SUMS" ] || { echo "::error::$source/SHA256SUMS is missing."; exit 1; }
            cp "$source/build-manifest.json" "dist/build-manifest-$target.json"
            cp "$source/SHA256SUMS" "dist/SHA256SUMS-$target"
          done
          cd dist
          declare -A released_names=()
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            [ -z "${released_names[$name]+present}" ] || {
              echo "::error::Duplicate release artifact name $name." >&2
              exit 1
            }
            released_names["$name"]=1
            printf '%s  %s\n' "$(sha256sum "$artifact" | cut -d ' ' -f 1)" "$name"
          done < <(
            find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 | sort -z
          ) > SHA256SUMS
          cat SHA256SUMS

      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 | sort -z
          )
          [ "${#assets[@]}" -eq 6 ] || {
            echo "::error::Expected six desktop release artifacts, found ${#assets[@]}."
            exit 1
          }
          metadata=(
            dist/build-manifest-macos-arm64.json
            dist/build-manifest-macos-x64.json
            dist/build-manifest-windows-x64.json
            dist/SHA256SUMS
            dist/SHA256SUMS-macos-arm64
            dist/SHA256SUMS-macos-x64
            dist/SHA256SUMS-windows-x64
          )
          gh release create "$TAG" "${assets[@]}" "${metadata[@]}" \
            --verify-tag \
            --generate-notes \
            --title "DeepSeek Harness Desktop ${{ needs.authorize-release.outputs.version }}"
